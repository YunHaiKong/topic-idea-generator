<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>topic-idea-generator 输出示例</title>
  <desc>一张示例选题表，展示 5 维发散与三平台标题变体的输出格式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="340" y="36" text-anchor="middle" fill="#185FA5" style="font-size:14px; font-weight:500">示例输出：12 条选题（节选 3 条）</text>
  <text class="ts" x="340" y="56" text-anchor="middle" fill="#5F5E5A" style="font-size:11px">领域：职场 AI 提效 | 受众：25-35 职场人 | 平台：公众号 + 小红书 + 抖音</text>

  <g>
    <rect x="40" y="80" width="600" height="76" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text class="th" x="56" y="100" fill="#173404" style="font-size:12px; font-weight:500">#1  我用 5 个 AI 工具把每天 2 小时压到 15 分钟</text>
    <text class="ts" x="56" y="118" fill="#27500A" style="font-size:11px">角度：数字 + 痛点   |   爆款度：高</text>
    <text class="ts" x="56" y="136" fill="#3B6D11" style="font-size:11px">公众号：我用 5 个 AI 工具，把每天 2 小时重复工作压到 15 分钟</text>
    <text class="ts" x="56" y="150" fill="#3B6D11" style="font-size:11px">小红书：打工人的救星 ⏰ 这 5 个 AI 工具真的省命！</text>
  </g>

  <g>
    <rect x="40" y="170" width="600" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="56" y="190" fill="#26215C" style="font-size:12px; font-weight:500">#2  月薪 1 万 vs 月薪 3 万，差距全在这 3 个 AI 工具</text>
    <text class="ts" x="56" y="208" fill="#3C3489" style="font-size:11px">角度：反差 + 圈层   |   爆款度：高</text>
    <text class="ts" x="56" y="226" fill="#534AB7" style="font-size:11px">公众号：月薪 1 万 vs 月薪 3 万，差距全在这 3 个 AI 工具</text>
    <text class="ts" x="56" y="240" fill="#534AB7" style="font-size:11px">小红书：月薪 3 万的同事都在偷偷用什么？🤫</text>
  </g>

  <g>
    <rect x="40" y="260" width="600" height="76" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="56" y="280" fill="#501313" style="font-size:12px; font-weight:500">#7  实习生用 AI 写的方案，比 5 年老员工还专业？</text>
    <text class="ts" x="56" y="298" fill="#791F1F" style="font-size:11px">角度：反差 + 好奇   |   爆款度：高</text>
    <text class="ts" x="56" y="316" fill="#A32D2D" style="font-size:11px">公众号：实习生用 AI 写的方案，比 5 年老员工还专业？</text>
    <text class="ts" x="56" y="330" fill="#A32D2D" style="font-size:11px">小红书：实习生的 AI 方案吊打 5 年老员工 💀 真相是…</text>
  </g>

  <text class="ts" x="340" y="380" text-anchor="middle" fill="#5F5E5A" style="font-size:11px">每条选题带：核心标题 · 角度标签 · 三平台变体 · 推荐理由 · 预估爆款度</text>

  <g>
    <rect x="40" y="400" width="600" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text class="ts" x="56" y="426" fill="#412402" style="font-size:11px">本批规律：数字锚点 + 反差钩子占比 67%   |   建议优先写 #1 / #2 / #5</text>
  </g>
</svg>
